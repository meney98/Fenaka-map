<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">
  <title>FENAKA Fonadhoo Feeder Map</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand"><b>FENAKA</b><span>Fonadhoo Feeder Map</span></div>
  <button id="ownerBtn">Owner</button>
</header>

<div class="toolbar">
  <div class="searchWrap">
    <input id="search" placeholder="Search house name / number" autocomplete="off">
    <div id="suggestions"></div>
  </div>
  <div class="feeders" id="feeders">
    <button data-feeder="Fenaka Branch">Fenaka Branch</button>
    <button data-feeder="SS01">SS 01</button>
    <button data-feeder="SS02">SS 02</button>
    <button data-feeder="SS03">SS 03</button>
    <button data-feeder="SS04">SS 04</button>
    <button data-feeder="SS05">SS 05</button>
    <button data-feeder="SS06">SS 06</button>
    <button data-feeder="SS07">SS 07</button>
  </div>
</div>

<main id="mapViewport" aria-label="Interactive Fonadhoo map">
  <div id="mapStage">
    <img id="mapImage" src="fonadhoo-map.png" alt="Fonadhoo map" draggable="false">
    <div id="markerLayer"></div>
  </div>
  <div class="zoomControls">
    <button id="zoomIn">+</button>
    <button id="zoomOut">−</button>
    <button id="reset">Reset</button>
  </div>
  <div class="hint">Drag to move • Pinch to zoom</div>
</main>

<div id="infoPanel" class="panel hidden">
  <button id="closePanel">×</button>
  <h3 id="infoTitle"></h3>
  <div id="infoBody"></div>
</div>

<script src="labels.js"></script>
<script src="app.js"></script>
</body>
</html>
