<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1'><title>Fenaka Fonadhoo Interactive Map</title><link rel='stylesheet' href='style.css'></head><body>
<header><div><b>Fenaka Fonadhoo Interactive Map</b><small>Search houses / B-numbers</small></div><input id='search' placeholder='Search e.g. Shurooq or B-01'><button id='reset'>Reset</button></header>
<div id='map'><div id='stage'><img src='fenaka-map.png' alt='Fenaka Fonadhoo map'><div id='markers'></div></div></div>
<div class='zoom'><button id='zin'>+</button><button id='zout'>−</button></div>
<div id='card' class='card hidden'><button id='close'>×</button><h2 id='cname'></h2><div class='row'><b>House/No.</b><span id='cnum'>—</span></div><div class='row'><b>Zone</b><span id='czone'>—</span></div><div class='row'><b>Distribution Box No.</b><span>—</span></div><div class='row'><b>Breaker No.</b><span>—</span></div><div class='row'><b>Owner Name</b><span>—</span></div><div class='row'><b>Mobile Number</b><span>—</span></div></div>
<script src='app.js'></script></body></html>
