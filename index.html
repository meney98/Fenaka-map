<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fenaka Fonadhoo Clear Interactive Map</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
html,body,#map{height:100%;margin:0}body{font-family:system-ui,-apple-system,sans-serif}.top{position:absolute;z-index:1000;left:12px;right:12px;top:12px;display:flex;gap:8px}.search{flex:1;max-width:560px;background:#fff;border-radius:12px;box-shadow:0 2px 14px #0003;padding:11px 13px;border:0;font-size:16px}.btn{background:#b00020;color:#fff;border:0;border-radius:10px;padding:0 14px;font-weight:700}.results{position:absolute;z-index:1000;left:12px;top:64px;width:min(560px,calc(100% - 24px));max-height:45vh;overflow:auto;background:white;border-radius:12px;box-shadow:0 2px 14px #0003;display:none}.item{padding:10px 12px;border-bottom:1px solid #eee;cursor:pointer}.label{font-size:12px;font-weight:800;white-space:nowrap;text-shadow:-1px -1px 2px white,1px 1px 2px white,0 0 4px white;background:rgba(255,255,255,.78);padding:2px 4px;border-radius:3px}.leaflet-div-icon{background:transparent;border:0}.maplabel{display:none}.leaflet-zoom-animated .maplabel{display:none}.legend{position:absolute;z-index:1000;right:12px;bottom:22px;background:#fff;padding:9px 11px;border-radius:10px;box-shadow:0 2px 14px #0003;font-size:12px}.hint{position:absolute;z-index:1000;left:12px;bottom:20px;background:#fff;padding:7px 10px;border-radius:9px;box-shadow:0 2px 12px #0002;font-size:12px}
</style></head><body><div id="map"></div><div class="top"><input id="q" class="search" placeholder="Search house name, B-number or K-number…"><button class="btn" id="home">HOME</button></div><div id="results" class="results"></div><div class="hint">High-resolution map • Zoom in for house names</div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const W=6000,H=4952;const map=L.map('map',{crs:L.CRS.Simple,minZoom:-3,maxZoom:4,zoomSnap:.25,zoomControl:true});const bounds=[[0,0],[H,W]];L.imageOverlay('map.jpg',bounds,{interactive:false}).addTo(map);map.fitBounds(bounds);let data=[],markers=[];
function popup(r){const saved=JSON.parse(localStorage.getItem('fenaka:'+r.name)||'{}');return `<div style="min-width:240px"><b style="font-size:16px">${r.name}</b><hr><label>SS Zone</label><input id="z" value="${saved.zone||''}" style="width:100%"><label>Distribution Box No.</label><input id="d" value="${saved.box||''}" style="width:100%"><label>Breaker No.</label><input id="b" value="${saved.breaker||''}" style="width:100%"><label>Owner Name</label><input id="o" value="${saved.owner||''}" style="width:100%"><label>Mobile Number</label><input id="m" value="${saved.mobile||''}" style="width:100%"><button onclick='saveRec(${JSON.stringify(r.name)})' style="margin-top:8px;width:100%;padding:7px">Save</button></div>`}
window.saveRec=n=>{localStorage.setItem('fenaka:'+n,JSON.stringify({zone:z.value,box:d.value,breaker:b.value,owner:o.value,mobile:m.value}));map.closePopup()};
function updateLabels(){const show=map.getZoom()>=0.5;markers.forEach(([r,m])=>{const e=m.getElement();if(e)e.style.display=show?'block':'none'})}map.on('zoomend',updateLabels);
fetch('labels.json').then(r=>r.json()).then(d=>{data=d;d.forEach(r=>{let mk=L.marker([r.y,r.x],{icon:L.divIcon({className:'maplabel',html:`<span class="label">${r.name}</span>`,iconSize:null})}).bindPopup(()=>popup(r));mk.addTo(map);markers.push([r,mk])});updateLabels()});
const q=document.getElementById('q'),res=document.getElementById('results');q.oninput=()=>{let s=q.value.trim().toLowerCase();if(!s){res.style.display='none';return}let a=markers.filter(([r])=>r.name.toLowerCase().includes(s)).slice(0,80);res.innerHTML=a.map((x,i)=>`<div class="item" data-i="${i}">${x[0].name}</div>`).join('');res.style.display='block';[...res.children].forEach((el,i)=>el.onclick=()=>{let [r,m]=a[i];map.setView([r.y,r.x],2.25);m.openPopup();res.style.display='none';q.value=r.name})};document.getElementById('home').onclick=()=>map.fitBounds(bounds);
</script></body></html>
